name: swarm-reactor-pr519-verify

on:
  push:
    branches:
      - "release-gate/swarm-reactor-onchain-v1"
  workflow_dispatch:

concurrency:
  group: swarm-reactor-pr519-verify
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    # Same-repository branch only. There is deliberately no pull_request trigger,
    # so untrusted fork code is never executed on the self-hosted X3 runner.
    runs-on: [self-hosted, Linux, X64, x3]
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 8

    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4

      - name: Restore local Rust toolchain PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Record revision
        run: |
          git rev-parse HEAD
          "$HOME/.cargo/bin/rustc" --version
          "$HOME/.cargo/bin/cargo" --version

      - name: Northern Swarm pallet
        run: cargo test -p pallet-northern-swarm --all-targets --no-fail-fast

      - name: Northern Swarm executor
        run: cargo test -p northern-swarm --all-targets --no-fail-fast

      - name: Northern Swarm benchmark suite
        run: cargo test -p pallet-northern-swarm --features runtime-benchmarks --no-fail-fast

      - name: Generate measured Northern Swarm weights
        run: |
          if grep -q "THIS FILE WAS AUTO-GENERATED USING THE SUBSTRATE BENCHMARK CLI" pallets/northern-swarm/src/weights.rs; then
            echo "Measured Northern Swarm weights already committed."
            exit 0
          fi
          cargo build --release -p x3-chain-node --features runtime-benchmarks
          BENCHMARK_STEPS=50 BENCHMARK_REPEAT=20 \
            bash scripts/run-frame-benchmarks.sh run pallet-northern-swarm
          grep -q "THIS FILE WAS AUTO-GENERATED USING THE SUBSTRATE BENCHMARK CLI" \
            pallets/northern-swarm/src/weights.rs
          git config user.name "x3-benchmark-bot"
          git config user.email "benchmark-bot@x3-chain.local"
          git add pallets/northern-swarm/src/weights.rs
          git commit -m "bench(swarm): record measured FRAME weights"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Release runtime integration
        run: cargo check -p x3-chain-runtime --features mainnet-rc1

      - name: Focused Swarm Reactor release gate
        run: python3 scripts/mainnet/swarm_reactor_gate.py

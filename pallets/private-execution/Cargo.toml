[package]
name = "pallet-private-execution"
version = "0.1.0"
authors = ["X3 Chain Core Team <core@x3-chain.io>"]
description = "Private execution environments pallet — encrypted mempools, confidential GPU enclaves, threshold decryption, and MEV-protected transaction processing."
edition = "2021"
license = "Apache-2.0"
homepage = "https://x3-chain.io"
repository = "https://github.com/x3-chain/x3-chain"
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
crate-type = ["rlib"]

[dependencies]
frame-support = { workspace = true, default-features = false }
frame-system = { workspace = true, default-features = false }
frame-benchmarking = { workspace = true, default-features = false, optional = true }
pallet-balances = { workspace = true, default-features = false }
parity-scale-codec = { workspace = true, default-features = false, features = ["derive", "max-encoded-len"] }
scale-info = { workspace = true, default-features = false, features = ["derive"] }
serde = { version = "1.0.197", default-features = false, features = ["derive", "alloc"] }
sp-core = { workspace = true, default-features = false }
sp-io = { workspace = true, default-features = false }
sp-runtime = { workspace = true, default-features = false }
sp-std = { workspace = true, default-features = false }
log = { workspace = true, default-features = false }
# The commit–reveal ordering lane, `no_std`, so the chain can enforce the same
# algorithm the lane's own tests verify instead of a second implementation of it.
x3-order-window = { path = "../../crates/x3-order-window", default-features = false }
x3-threshold-core = { path = "../../crates/x3-threshold-core", default-features = false }

[dev-dependencies]
sp-io = { workspace = true }
# The tests build real submissions: a real committee secret, its group key, and a ciphertext
# encrypted to it. A hardcoded `vec![0xBB; 32]` group key cannot be used any more, which is the
# point of the change below.
curve25519-dalek = { version = "4.1.3", features = ["rand_core"] }
rand = "0.8"

[features]
default = ["std"]
std = [
    "frame-support/std",
    "frame-system/std",
    "pallet-balances/std",
    "parity-scale-codec/std",
    "scale-info/std",
    "sp-std/std",
    "sp-core/std",
    "sp-io/std",
    "sp-runtime/std",
    "serde/std",
    "log/std",
    "x3-order-window/std",
    "x3-threshold-core/std",
    "frame-benchmarking?/std",
]
runtime-benchmarks = [
    "frame-benchmarking",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
]

[package]
name = "x3-threshold-core"
version = "0.1.0"
edition = "2021"
authors = ["X3 Chain Team"]
description = "no_std threshold-encryption core: the committee crypto a runtime pallet can validate"
license.workspace = true
publish = false

[dependencies]
# No `std` on any of these: this crate has to compile inside a runtime pallet.
parity-scale-codec = { workspace = true, default-features = false, features = ["derive"] }
sp-std = { workspace = true, default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "precomputed-tables", "zeroize", "rand_core"] }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
blake3 = { version = "1.5", default-features = false }
rand_core = { version = "0.6", default-features = false }
# Only the RNG-dependent helpers need this, and only when `std` is on.
rand = { version = "0.8", default-features = false, features = ["getrandom"], optional = true }

[features]
default = ["std"]
std = ["sp-std/std", "rand", "rand/std"]

[dev-dependencies]
rand = { version = "0.8", features = ["std", "std_rng"] }

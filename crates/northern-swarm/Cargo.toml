[package]
name = "northern-swarm"
version = "0.1.0"
edition = "2021"
description = "Northern Swarm: off-chain executor, registry-v2 interface, deterministic proof loop (RC1–RC5)"
license = "MIT"

[[bin]]
name = "northern-swarm"
path = "src/main.rs"

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
thiserror   = { workspace = true }
hex         = { workspace = true, features = ["alloc"] }
sha2        = "0.10"
chrono      = { version = "0.4", default-features = false, features = ["clock"] }
codec       = { workspace = true }
reqwest     = { workspace = true }

# Chain metadata/signing and shared runtime task types.
subxt = "0.50.3"
subxt-signer = { version = "0.50.3", default-features = false, features = ["std", "sr25519", "subxt"] }
sp-core = { workspace = true, features = ["std"] }
pallet-northern-swarm = { path = "../../pallets/northern-swarm" }

# Vendor-neutral accelerator layer. CPU remains the deterministic reference.
x3-accel = { path = "../x3-accel" }
# The Reactor's benchmark half: a scheduling decision becomes a benchmark job's
# placement (`ScheduleDecision::placement`), which the run attestation must match.
x3-bench = { path = "../x3-bench" }

[features]
default = []
wgpu = ["x3-accel/wgpu"]

[dev-dependencies]
# The end-to-end placement test signs a run attestation the way an attester would.
ed25519-dalek = { workspace = true }

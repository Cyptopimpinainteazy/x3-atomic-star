  "Closed 2026-09-27 - a disputed task can no longer strand the submitter's bond. `pallets/northern-swarm` gained `resolve_disputed_task(task_id)` (call_index 8, weight `T::WeightInfo::resolve_disputed_task`): it accepts only a task in `TaskStatus::Disputed`, zeroes the record's reward, moves the task to the new terminal `TaskStatus::Refunded`, unreserves the exact reward back to the submitter, and emits `DisputedTaskRefunded`. It is deliberately permissionless (it can only move the submitter's own reserved funds). Three tests drive the real dispatchables: `resolve_disputed_task_refunds_submitter_and_preserves_issuance` (reserved 90 -> 0, submitter free +90, `TotalIssuance` unchanged, all three executor stakes still 100, event emitted), `resolve_disputed_task_rejects_tasks_that_are_not_disputed` (Pending and Finalised -> `TaskNotDisputed`, unknown id -> `TaskNotFound`) and `resolve_disputed_task_cannot_be_replayed` (second call refused, no second refund). Weights regenerated by the benchmark CLI (`resolve_disputed_task` = 96_270_000 ps, proof 4149). Break-it-first: deleting the status guard reddens exactly the two negative tests; restoring the file byte-identically (sha256 af76769b8d0fc0c80f28336a245e5f51885692beb49d77f6aae2709e62a16e4b) reddens none. `SlashReason::QuorumMismatch` still has no constructor - hashes cannot prove which executor was wrong, so no stake is slashed on a dispute.",
  "Closed 2026-09-27 - accelerator selection no longer trusts the device. `crates/northern-swarm/src/backend.rs` gained `AutoBackend`, which always computes the CPU reference, compares any accelerator output byte-for-byte against it, returns the accelerator result only on agreement, and on divergence quarantines the device (storing both hashes in `Divergence`), records it in `BackendTelemetry`, and returns the CPU result. A refusal/error is a separate, counted fallback, not a divergence. `TaskExecutor` now executes through `AutoBackend` instead of accepting a GPU result directly, and `AutoBackend::execute` fails closed on a kind it does not support (`AiInference`). Four tests: parity (`auto_backend_agrees_with_the_cpu_reference_on_supported_work`), fallback (`..._falls_back_to_cpu_when_the_accelerator_refuses`), quarantine with a deliberately divergent fake accelerator that must not change the result and must not be consulted again (`..._quarantines_a_divergent_accelerator_and_returns_the_cpu_result`), and fail-closed on an unsupported kind. Break-it-first: removing the `candidate == reference` comparison returns the fake's `0xDEADBEEF` and reddens the quarantine test; restoring the file byte-identically reddens none.",

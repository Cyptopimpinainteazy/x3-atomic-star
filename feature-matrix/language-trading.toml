blockers = ["Receipts carry an ed25519 attestation with a key id, `receipt verify --trusted <key>` requires and validates it (a different key is refused by name), any edited field breaks the hash, and mainnet now *requires* a trusted key (TICKET-135); what was missing was a key registry or rotation story, since keys were named per invocation. **Closed 2026-09-28:** `ReceiptKeyRegistry` records each key as `active`, `retired` (rotated out: still verifies what it signed, `may_sign` is false) or `revoked` (compromised: refused by name, including for receipts signed before the revocation). A registry that could be misread is refused at load: a duplicate id, one public key under two ids, no active key, a malformed key, or unknown fields. `x3c receipt verify --trusted-registry <file>` uses it and satisfies mainnet's trusted-key requirement. Disabling the revocation check turns the VM and CLI tests red. Still open: nothing distributes or signs the registry file itself, and the signing side (`receipt execute`) does not consult it, so a retired key is marked as not signing but is not prevented from signing"]

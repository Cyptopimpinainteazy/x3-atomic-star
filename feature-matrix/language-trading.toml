blockers = [
  "Re-measured 2026-09-26 (TICKET-150). The previous note described checks the command did not run: `cmd_replay` called `verify_receipt` — the hash and the accounting invariants — while printing that the economics had been checked, and `receipt verify` promised \"hash + economic invariants\" in its own text without calling `verify_receipt_economics` either. Both now run the economic replay, and `replay` first binds the receipt's operation sequence to the artifact's compiled program (`decode_trading_program`), which is what makes the floors and ceilings inside it the artifact's rather than figures the receipt chose: a receipt re-hashed with a 900 bps ceiling against an artifact compiling 30 used to replay as ok.",
  "The floors and ceilings are now re-derived from the receipt's own figures: `AssertMinNetProfit` and the policy's `minimum_net_profit` are enforced against the delta of the asset each is denominated in (`ProfitBelowCompiledFloor`, `ProfitFloorWithoutAsset`), `max_slippage_bps` against each leg's recorded realized slippage (receipt format 3; a missing figure is refused, not read as zero), `max_flash_fee_bps` against each debt's principal and fee, and the pre-existing quote-freshness, price-impact, MEV-leakage and cost-kind checks stay. `basis_points_of` is now the single place the fee and slippage ratios are computed, so the figure execution enforces and the figure a receipt carries cannot drift.",
  "What a receipt and an artifact still cannot decide, and what the command prints as unchecked rather than passing over: the finality references, the host inputs (a receipt records what happened, not what was asked), and the balances behind the `state_commitment` (a receipt carries the commitment, not the state it commits to). The per-run cost the host reports is re-derived only for the ceilings the receipt carries, so the `max_gas` and oracle-deviation halves of \"correct risk checks\" remain unreproducible from the pair.",
]

# Economic / DeFi feature matrix fragment.

[[feature]]
id = "X3-ECO-001"
name = "Biometric wallet registration"
subsystem = "economic_defi"
source = "master"
paths = ["pallets/x3-wallet-pallet"]
implemented = 70
tested = 65
mainnet_ready = 35
priority = "P0"
confidence = "high"
launch_scope = "core"
claim_risk = false
blockers = [
  "Re-measured 2026-09-26: the pallet's `register_biometric` validated nothing and did not call the library that does. It built the `BiometricProfile` by hand — any `biometric_type`, an all-zero template hash, an all-zero PIN hash — and hardcoded `owner: [0u8; 32]`, so the stored profile did not name the account that registered it. `crates/x3-wallet`'s `BiometricManager::create_profile` had rejected all three of those the whole time. The extrinsic now calls it and maps its refusals onto named pallet errors (`InvalidBiometricType`, `EmptyTemplateHash`, `EmptyPinHash`, with `InvalidBiometricProfile` as the unnamed fallback), and the stored profile carries the signer's 32-byte address. Measured load-bearing: disabling the library's template check makes `register_biometric_refuses_an_empty_template_hash` fail, which is the delegation proof.",
  "Still unexercised: nothing consumes `attempts_remaining` or `locked_until_block`. There is no verify-unlock extrinsic in this pallet, so the lockout counters are stored and never spent, and a re-registration resets them. A lockout that nothing updates is not a lockout.",
  "No independent security review of the template handling, and no decision recorded about whether a template hash belongs on chain at all (the profile's `attempts_remaining`/`locked_until_block` design assumes a verifier that does not exist here).",
]
test_evidence = [
  "pallets/x3-wallet-pallet/src/tests.rs",
  "note: cargo test -p pallet-x3-wallet -> 23 passed, 0 failed; cargo clippy -p pallet-x3-wallet --all-targets -- -D warnings and cargo fmt -p pallet-x3-wallet -- --check are clean; cargo check -p x3-chain-runtime compiles the pallet into all runtime variants",
  "note: measured load-bearing - removing the `template_hash == [0u8; 32]` check from crates/x3-wallet's `BiometricManager::create_profile` makes `register_biometric_refuses_an_empty_template_hash` FAIL in the pallet's suite, proving the pallet refuses because the library refuses",
]
required_tests = [
  "register_biometric_works",
  "register_biometric_refuses_an_unsupported_type",
  "register_biometric_refuses_an_empty_template_hash",
  "register_biometric_refuses_an_empty_pin_hash",
]
evidence = ["pallets/x3-wallet-pallet", "crates/x3-wallet/src/biometric_unlock.rs", "note: Registry explicitly flags biometric security review; the pallet now delegates to the library's validator instead of re-implementing it"]
registry_feature = "x3_wallet_pallet"


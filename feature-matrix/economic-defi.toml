[[feature]]
id = "X3-ECO-003"
name = "Supply conservation ledger"
subsystem = "economic_defi"
source = "master"
paths = ["pallets/x3-supply-ledger/src/lib.rs"]
implemented = 65
tested = 88
mainnet_ready = 52
priority = "P0"
confidence = "high"
launch_scope = "core"
claim_risk = false
blockers = [
  "**CLOSED 2026-09-25 at the ledger level.** The conservation law is `represented() = native + evm + svm + external_locked + pending` never exceeding the canonical ceiling, and every transition being a relabelling rather than a creation: debit moves source -> pending, credit moves pending -> destination, refund moves pending -> source. `tests_conservation.rs` asserts exactly that after every step of the success path (native -> EVM), the external route (native -> `external_locked`), the rollback path (debit then refund restores the ledger bit-for-bit), the duplicate-settle case (a replayed settle is refused), the halt/pause cases (new legs refused, refunds still allowed), and 200 random leg sequences. The mint path's own conservation is covered too: a governance mint raises the ceiling with the supply, and a replayed nonce moves neither.",
  "**HALF CLOSED 2026-09-26 — concurrent traffic on a multi-validator network now has a conservation proof, for native balances.** That was one of this row's three open items ('concurrent cross-domain traffic under a multi-validator network'). `node/tests/supply_invariant_distributed.rs` (gate: `supply invariant across validators`, ~200s, serial — it binds node ports) boots the three-validator `local3` chain from one frozen node binary, drives five comits per account into all three validators concurrently — each one required to have an execution receipt on a validator that never received it — and then, at one finalized block, reads the conservation identity from **each validator's own state**: `sum(free + reserved)` over every `System::Account` enumerated with `state_getKeys` at that block hash versus the runtime's own `AtlasKernelRuntimeApi::get_total_issuance()` at the same hash. Measured: baseline 8 accounts, 8000000000000000000 == 8000000000000000000 on all three; after traffic, finalized block 107, all three report accounted 7999999998338644985 == TotalIssuance 7999999998338644985, and the fall in account balances equals the fall in issuance exactly (each account paid 553785005). Load-bearing: injecting one unit into `Balances::TotalIssuance` in a scratch genesis makes the same check fail by exactly that unit (`delta 1`).",
  "**CLOSED 2026-09-26 — the per-asset identity is asserted on every validator, over a record that exists.** The previous note said the per-asset half had no read surface. It has one now: `AtlasKernelRuntimeApi_get_asset_supply_ledger(asset_id)` returns the ledger pallet's own `SupplyLedger`, and the distributed test reads it at one finalized block on each of three validators, enumerating the ledger's key set from the pallet's own storage prefix rather than hard-coding a key. The record has to *exist*: the test now creates one through `X3TokenFactory::create_token` (the signed path, via a new `sign_token_factory_create` in `x3-runtime-signer`) and **fails** if no record appears within 120s, so the assertion cannot pass over an empty map. Measured: asset `0xcbd7f754…` reads `native 1000000000000, evm 0, svm 0, external_locked 0, pending 0, canonical 1000000000000` — identity holds, all three validators identical — while the native conservation numbers are unchanged from before the extension (7,999,999,998,338,644,985 on all three) and the injected-unit control still fails by exactly one.",
  "Still open, and why `mainnet_ready` moves by 7 and not more: this proves the identity over **one** asset on a three-validator local chain, with the `evm`/`svm`/`external_locked` legs at zero — a real bridge lock moving `external_locked` and a cross-VM transfer moving `evm`/`svm` are still unexercised, and the seven-validator network has not been used for this check.",
]
required_tests = [
  "every_leg_of_the_lifecycle_conserves_the_represented_total",
  "a_replayed_mint_nonce_cannot_mint_twice",
  "prop_random_leg_sequences_conserve_supply",
  "a_halt_or_a_pause_blocks_new_legs_but_still_lets_the_pending_one_come_back",
]
test_evidence = [
  "note: all four are in pallets/x3-supply-ledger/src/tests_conservation.rs, run by the `test x3-supply-ledger` gate (2026-09-25)",
]
evidence = ["pallets/x3-supply-ledger/src/lib.rs", "note: Independent audit previously scored supply ledger partial", "note: 2026-09-25 - the ledger's conservation law is asserted on the real transition functions, including refusal-immutability"]
registry_feature = "atomic_kernel"
[[feature]]
id = "X3-ECO-004"
name = "Wallet recovery flow"
subsystem = "economic_defi"
source = "master"
paths = ["pallets/x3-wallet-pallet"]
implemented = 75
tested = 70
mainnet_ready = 35
priority = "P0"
confidence = "high"
launch_scope = "core"
claim_risk = false
blockers = [
  "Re-measured 2026-09-26: recovery was an announcement, not a flow. `initiate_recovery(origin, new_owner)` required only that `RecoveryAccounts[caller]` existed, then emitted `RecoveryInitiated { account, new_owner }` — no guardian check, no quorum, no delay, and no state change. Worse, nothing in the pallet ever *wrote* `RecoveryAccounts`, so the only registered extrinsic could never pass (`WalletNotFound` on every chain), and its own test seeded the record by inserting into storage directly.",
  "Closed with the library's own model (`crates/x3-wallet/social_recovery.rs`, unused before this change): `register_recovery_guardians` (owner-only; the set is built by `SocialRecoveryManager::create_recovery_account`, so the 1-to-30 guardian and threshold rules apply) → `initiate_recovery(account_id, new_owner)` by a *guardian* (the account is named explicitly; keying it off the caller looks up the wrong record) recording a delayed request → `approve_recovery` by guardians with a duplicate approval refused → `finalize_recovery` only when the threshold is met *and* the delay has elapsed, which is the single place the stored recovery owner changes → `cancel_recovery` by the recovery owner. Every refusal has a named test, and two controls were measured: disabling the library's delay check plus the pallet's own `ensure!` lets an early finalize through, and an earlier version of the fix reported `previous_owner == new_owner` in the executed event until the event captured the owner before the move.",
  "What the owner change is *not*: the recovery owner is a `[u8; 32]` address in the recovery record. It is the authority for future guardian operations, but no `T::AccountId` binding, balance, or `HardwareWallets` entry follows it, so 'recovery' currently recovers the right to manage a guardian set rather than control of an account. Closing that needs a decision about what an account's owner means on this chain.",
  "Still open: no security review, no expiry for an abandoned request (a pending request blocks a new one until the owner cancels), no guardian-initiated cancel, and no test that a request survives a runtime upgrade.",
]
test_evidence = [
  "pallets/x3-wallet-pallet/src/tests.rs",
  "note: cargo test -p pallet-x3-wallet -> 23 passed, 0 failed (was 13 before this change); the lifecycle test walks request -> threshold -> delay -> owner change and asserts the stored state at each step, not just the events",
  "note: measurement that replaced the old test - the removed test called initiate_recovery as the account being recovered, against a storage-seeded guardian record, and asserted only that an event was emitted. It is replaced by `the_account_owner_cannot_initiate_recovery` (the owner is refused) plus `recovery_runs_from_guardian_request_to_owner_change` (a completed, state-changing lifecycle), so coverage went up rather than sideways",
]
required_tests = [
  "register_recovery_guardians_applies_the_library_rules",
  "the_account_owner_cannot_initiate_recovery",
  "recovery_runs_from_guardian_request_to_owner_change",
  "the_owner_can_cancel_a_pending_recovery",
  "initiate_recovery_fails_without_guardian",
]
evidence = ["pallets/x3-wallet-pallet", "crates/x3-wallet/src/social_recovery.rs", "note: The registry required the old recovery-initiation test; that test is replaced by a real lifecycle (see the blockers)"]
registry_feature = "x3_wallet_pallet"


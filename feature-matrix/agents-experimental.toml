  "Closed 2026-09-27 — accelerator selection no longer trusts the device. `backend.rs` gained `AutoBackend`: it always computes the CPU reference, compares any accelerator output byte-for-byte, returns the accelerator result only on agreement, and on divergence quarantines the device (storing both hashes in `Divergence`), records it in `BackendTelemetry`, and returns the CPU result. Refusal/error is a separate, counted fallback. `TaskExecutor` now executes through `AutoBackend`, and `AutoBackend::execute` fails closed on a kind it does not support. Evidence: `auto_backend_agrees_with_the_cpu_reference_on_supported_work`, `auto_backend_falls_back_to_cpu_when_the_accelerator_refuses`, `auto_backend_quarantines_a_divergent_accelerator_and_returns_the_cpu_result` (a fake returning `0xDEADBEEF` cannot change the result and is never consulted again) and `auto_backend_refuses_a_kind_it_cannot_serve`. Break-it-first: dropping the `candidate == reference` comparison reddens exactly the quarantine test.",

# Agents / Experimental feature matrix fragment.

[[feature]]
id = "X3-AGENT-001"
name = "X3 control pallet"
subsystem = "agents_experimental"
source = "master"
paths = ["pallets/pallet-x3-control"]
implemented = 65
tested = 60
mainnet_ready = 20
priority = "P2"
confidence = "medium"
launch_scope = "dev_tooling"
claim_risk = false
blockers = [
  "**Reviewed 2026-09-26, and the review found the same class of hole the row's evidence already recorded once — in the next arm along.** `ControlAuthority::Operator` was satisfied by `ensure_signed(origin)?` and nothing else, so *any* account at all could pause or resume *any* control domain on a ten-block cooldown. On a chain that wired this pallet up, that is a liveness lever anyone could pull, and it is exactly the shape the row's earlier fix (governance authority accepted from a signed account) closed for a different arm. Operators are now a governance-set list (`set_control_operators`, root-only, bounded at 50), empty at genesis, and `a_stranger_is_not_an_operator` pins the refusal — measured load-bearing: reverting the check to `ensure_signed` reddens that test and `only_governance_may_authorise_an_operator`; restoring returns 12/12. The remaining authority arms are: Root/Governance = root origin, EmergencyCommittee = membership of a governance-set committee, Operator = membership of a governance-set list, with `ensure_action_allowed` restricting each level (operator: pause/resume only) and a per-domain cooldown.",
  "**The pallet is not wired into anything, so none of this is enforced on a chain.** `runtime/src/lib.rs` does not mention `pallet_x3_control`, and nothing outside the pallet references `ControlState`, `ControlDomain` or `ControlRecords` — the state a control action writes is read by no consumer. The authority model is now fail-closed and tested, but a control plane nothing consults is not a control plane; wiring it (and naming what acts on `Frozen`/`Paused`) is a design decision, not a test.",
  "Still open: no external security review, and `execute_control_action`'s cooldowns are constants in code (`Root` 0, `Operator` 10, committee 1, governance 100 blocks) rather than runtime-configurable — a chain that wired this up would have to fork to retune them.",
]
required_tests = [
  "a_stranger_is_not_an_operator",
  "only_governance_may_authorise_an_operator",
  "an_authorised_operator_may_pause_but_not_freeze",
  "a_stranger_cannot_claim_governance_authority",
  "a_stranger_cannot_claim_root_authority",
  "only_committee_members_may_act_as_the_committee",
]
test_evidence = [
  "pallets/pallet-x3-control/src/tests.rs",
  "note: `cargo test -p pallet-x3-control` -> 12 passed, 0 failed (10 before; the operator test was rewritten to require authorisation and two were added); clippy --all-targets -D warnings and cargo fmt --check clean",
  "note: measured load-bearing - restoring `ensure_signed(origin)?` for the Operator arm reddens `a_stranger_is_not_an_operator` and `only_governance_may_authorise_an_operator`; restoring the list check returns 12/12",
]
evidence = [
  "pallets/pallet-x3-control",
  "note: 2026-09-19 joined the workspace and has 12 tests; its authority check had accepted ControlAuthority::Governance from any signed account (fixed then), and on 2026-09-26 the Operator arm was found to accept any signed account too (fixed now, with an empty-at-genesis governance list)",
]


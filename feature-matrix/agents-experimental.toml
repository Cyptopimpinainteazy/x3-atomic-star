  "crates/x3-swarm-core/src/approval.rs",
  "crates/x3-swarm-core/tests/sensitive_actions.rs",
  "services/x3-swarm-api/src/main.rs",
  "note: the `test x3-swarm-core` gate runs `cargo test --locked --all-targets` for the crate; re-measured 2026-09-27 at 107 passed (75 lib + 6 agent_lifecycle + 15 guard_tests + 11 sensitive_actions), 0 failed, 0 ignored",
  "note: measured 2026-09-27 - the API service's four tests drive its HTTP handlers against the crate's `SwarmScheduler` and run in the fast set through the `test x3-swarm-api` gate (converted from `check`, which ran nothing). Measured load-bearing: making the status path skip `SwarmScheduler::update_status` reddens exactly `the_start_and_complete_transitions_land_in_the_scheduler` (3 of 4 still green); the file was restored to its recorded SHA-256 and all four passed again",
  "note: measured load-bearing - deleting the `may_dispatch` call from `SwarmScheduler::claim_next_for` makes `a_killed_agent_is_not_handed_work` fail with the killed agent receiving task T-KILL, and restoring the call returns it to green",
  "note: measured load-bearing for the authorization path - (1) dropping the comparison between the caller-supplied approval hash and the derived commitment reddens exactly `a_foreign_approval_hash_is_refused_loudly` (10/11 stay green); (2) removing the action tag from the commitment reddens exactly `commitment_binds_the_action_and_the_subject` and `commitment_separates_fields`; (3) removing the security-council size floor reddens exactly `a_one_member_council_cannot_authorize_a_runtime_upgrade`. Each mutation was restored and the file hash verified identical before the next run.",
]
evidence = [
  "crates/x3-swarm-core",
  "note: FEATURE_REGISTRY records the history - four required_tests were removed by CRITICAL-TOK-1 in 2026-09-06 because none existed as real test functions; they exist now, and the dispatch-refusal pair is added alongside them",
  "note: 2026-09-27 - the crate's only authorization primitive, `ApprovalGate`, held a caller-chosen `ApprovalRequirement` and exposed `grant(&mut self)` setting it to `None`, so any agent holding its own gate could authorize itself; `request_approval` never called `is_satisfied` at all. It had no callers, which is why the hole was latent. The gate is now built from a `SensitiveAction` (runtime upgrade / token supply change / validator key replacement / genesis modification / settlement-rule change), derives its own requirement, derives the commitment the approval must cover, and refuses a caller-supplied hash that does not match. Nothing in the crate previously derived an approval hash - `action_hash` was supplied by the caller - so a signature issued for one action could be presented for another; `SensitiveRequest::commitment` is now its only producer.",

blockers = [
  "Re-measured 2026-09-26: the sanction ladder was real and tested, but it reached only one of the two dispatch surfaces. `SpawnGuard` consults the genesis record, so a killed agent cannot spawn a child — but the scheduler's only route to work was `next_task(AgentKind)`, which compared the agent's class and never asked the authority anything. Measured: with `Sanction::Kill` on record and a pending task queued, the killed agent was handed the task. Closed: `SwarmAuthority::may_dispatch` (no genesis record / terminated / expired / quarantined / suspended / killed -> `DispatchRefusal`) is now called by `SwarmScheduler::claim_next_for` (the consolidation renamed it from `next_task_for`), which is the only public route to a task; the old `next_task` is gone, so a caller cannot bypass it. An unregistered agent is refused too — the dispatcher fails closed on an identity it cannot check rather than reading 'no record' as 'no violations'.",
  "Re-measured 2026-09-27: the crate is still not on the deployed path — `crates/x3-swarm-core` is excluded from the root workspace and absent from the runtime dependency graph, so the control plane is enforced but not load-bearing for the deployed chain (the same gap as REG-x3_swarm_core-1). Closed in this change: the 'its own service does not call the scheduler' half. `services/x3-swarm-api` now holds every task in `x3_swarm_core::SwarmScheduler` instead of a private `BTreeMap`, so create/start/complete/fail/approve/reject are transitions on one scheduler, and the two stale, never-compiled service copies under `crates/x3-swarm-core/services/` were deleted rather than left as a second, disagreeing lifecycle.",
  "Sanctions escalate only; there is no governance reset path, so an agent that reaches Kill is permanently gone. That is intentional per AGENT_LAW §3, but it has never been exercised on a live multi-agent run, and there is still no race-condition or partition-tolerance testing for the control plane.",

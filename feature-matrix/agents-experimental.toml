[[feature]]
id = "X3-SWARM-001"
name = "Northern Swarm on-chain pallet (stake/task/quorum/reward)"
subsystem = "swarm_compute"
source = "master"
paths = ["pallets/northern-swarm"]
implemented = 82
tested = 78
mainnet_ready = 15
priority = "P1"
confidence = "medium"
launch_scope = "guarded"
claim_risk = false
blockers = [
  "Closed 2026-09-27 — a `Disputed` task no longer strands funds. `resolve_disputed_task` (call_index 8) refunds the submitter's exact reserved reward and moves the task to the new terminal `TaskStatus::Refunded`; it is permissionless because it can only move the submitter's own reserve, and it refuses any task not in `Disputed`. Evidence: `resolve_disputed_task_refunds_submitter_and_preserves_issuance` (reserved 90 -> 0, submitter free +90, `TotalIssuance` unchanged, three executor stakes still 100, `DisputedTaskRefunded` emitted), `resolve_disputed_task_rejects_tasks_that_are_not_disputed` (Pending/Finalised -> `TaskNotDisputed`) and `resolve_disputed_task_cannot_be_replayed`. `SlashReason::QuorumMismatch` still has no constructor: hashes alone cannot prove which executor was wrong, so no stake is slashed on a dispute.",
  "Accepted work is decided by hash equality, not verification. `finalise_with_quorum` pays an M-of-N set that agrees on a self-reported `result_hash`; nothing re-executes the work, so a quorum that agrees on a wrong hash is paid. There is no fraud proof, no verifiable computation and no challenge window. This is the difference between 'the executors agree' and 'the result is right', and the row's mainnet_ready reflects it.",
  "Weights are measured but host-specific. `BENCHMARK_STEPS=50 BENCHMARK_REPEAT=20 bash scripts/run-frame-benchmarks.sh run pallet-northern-swarm` on x3star1 (Xeon E5-2620 v4) produced the committed file with real proof sizes; a second run on the same host the same day moved `register_executor` between 78.998 ms and 90.536 ms of ref_time, so the reference hardware is not pinned in the repository.",
]
required_tests = [
  "quorum_requires_matching_results",
  "task_reward_moves_reserved_balance_to_winner",
  "task_reward_preserves_total_issuance",
  "full_nonmatching_commit_set_enters_dispute_without_payout",
  "multiple_executors_can_claim_one_task_up_to_the_bound",
  "resolve_disputed_task_refunds_submitter_and_preserves_issuance",
  "resolve_disputed_task_rejects_tasks_that_are_not_disputed",
  "resolve_disputed_task_cannot_be_replayed",
]
test_evidence = [
  "pallets/northern-swarm/src/tests.rs",
  "note: `quorum_requires_matching_results` pins both directions of M-of-N - two different hashes leave the 2-of-3 task in `ResultCommitted` and the third matching commit finalises it with `result_hash` set and the dissent kept in `ResultCommits`",
  "note: `task_reward_moves_reserved_balance_to_winner` asserts the exact deltas (submitter reserved 90 -> 0, each winner +45) and `task_reward_preserves_total_issuance` asserts `Balances::total_issuance()` is unchanged, so the payout is a transfer and never a mint",
  "note: `full_nonmatching_commit_set_enters_dispute_without_payout` is the ugly path for the same money: three different hashes leave the submitter's 90 reserved, free balance untouched, and claim slots at 0",
  "note: `resolve_disputed_task_refunds_submitter_and_preserves_issuance` closes that ugly path - it drives the real dispatchable to the refund and asserts reserved 90 -> 0, submitter free +90, `TotalIssuance` unchanged and all three executor stakes untouched; `resolve_disputed_task_rejects_tasks_that_are_not_disputed` pins the `TaskNotDisputed`/`TaskNotFound` refusals and `resolve_disputed_task_cannot_be_replayed` proves a second call moves nothing. One test asserts a non-zero refund, so a refund that silently does nothing cannot pass",
  "note: the mock had never recorded an event (`derive_impl(TestDefaultConfig)` left `frame_system::Config::RuntimeEvent = ()` and `new_test_ext` started at block 0, where `deposit_event` drops everything). Fixed in `mock.rs` so the refund's `DisputedTaskRefunded` event is now asserted rather than assumed",
]
evidence = [
  "pallets/northern-swarm/src/lib.rs",
  "pallets/northern-swarm/src/weights.rs",
  "runtime/src/lib.rs",
  "note: measured 2026-09-27 on the committed bytes - `cargo test -p pallet-northern-swarm --all-targets` 10 passed / 0 failed / 0 ignored; `cargo test -p pallet-northern-swarm --features runtime-benchmarks` 19 passed / 0 failed (including `bench_resolve_disputed_task`); `cargo clippy -p pallet-northern-swarm --all-targets -- -D warnings` clean",
  "note: the Merkle-free correctness argument is `finalise_with_quorum`'s `ensure!(winner_count >= QuorumThreshold)` plus `repatriate_reserved(..., BalanceStatus::Free)` with `ensure!(remaining.is_zero())`, so a share that cannot be moved fails the whole call instead of paying part of the set",
  "note: `swarm_reactor_gate.py` now requires the three dispute/refund test names and the `resolve_disputed_task` extrinsic with a `WeightInfo` weight and a `DisputedTaskRefunded` event, so removing the path reddens the release gate rather than only the unit suite",
]
registry_feature = "northern_swarm_reactor"


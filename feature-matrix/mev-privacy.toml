[[feature]]
# Provenance corrected 2026-09-22: cited PR #135 was closed unmerged, so it is not a source: this row's scores were recorded against that draft. Provenance corrected against master on 2026-09-22 by reading the tree; a full re-measurement is TICKET-101; the capability is on master: x3-lang/vm/src/executor.rs (snapshot/rollback path)
id = "X3-MEV-004"
name = "Transactional host rollback"
subsystem = "mev_privacy"
source = "master"
paths = [
  "x3-lang/compiler",
  "x3-lang/vm",
  "crates/x3-vm/src/storage.rs",
]
implemented = 55
tested = 45
mainnet_ready = 30
priority = "P0"
confidence = "high"
launch_scope = "guarded"
claim_risk = false
blockers = [
  "Re-measured 2026-09-26 on the *production* path (`crates/x3-vm`, which is what `pallet-x3-kernel` runs through `X3VmAdapter` — the row's own path, `x3-lang/compiler`, is not what the chain executes). The atomic window's rollback was not transactional: `VmStorage::rollback` restored the data map from its snapshot and then called `journal.clear()`, so every write recorded *before* the window was dropped from the journal too. Measured: write A, snapshot, write B, rollback -> `data = {A}` but an empty journal, and the journal is documented as the write delta for cross-VM sync. Fixed: the snapshot now records the journal length and rollback truncates to it, so a reverted window abandons only its own writes. Four tests, one break-it-first control (restoring `journal.clear()` reddens three of them).",
  "The journal still has no writer, so nothing on a chain exercises the guarantee. `crates/x3-vm/src/vm.rs` mutates `self.storage` only through `snapshot`/`commit`/`rollback`; there is no instruction in the interpreter that writes a key. `EvmSstore`/`EvmSload` exist in the ISA and the verifier (operands `slot:u8 val:u8`, 5000 gas) but hit the interpreter's `_` arm and return `UnimplementedOpcode`. Until a store is interpreted (or a hostcall writes storage), X3VM contracts cannot persist state at all, and the atomic rollback over storage can only be proven at the unit level (TICKET-145).",
  "The language VM's host-transaction protocol is unexercised in production: `TradingHost::begin_transaction`/`commit_transaction`/`rollback_transaction` have no caller outside `x3-lang/vm/tests`, and the bytecode-level `ATOMIC_ROLLBACK` in `x3-lang/vm/src/executor.rs` restores VM state (registers, memory, op records, instruction count) without invoking any host hook. That is safe only if a host never applies an effect during execution — a contract that is stated in the trait's docs and enforced nowhere.",
]
required_tests = [
  "test_rollback_keeps_the_journal_of_writes_that_predate_the_window",
  "test_nested_rollback_truncates_the_journal_to_the_inner_window",
  "test_rollback_of_the_outer_window_abandons_a_committed_inner_window",
  "test_rollback_of_a_delete_restores_the_key_and_the_journal",
  "test_nested_snapshots",
  "test_snapshot_and_rollback",
]
test_evidence = [
  "crates/x3-vm/src/storage.rs",
  "note: `cargo test -p x3-vm` -> 154 lib tests passed, 0 failed (plus 8 in another target and one pre-existing ignored test); `cargo clippy -p x3-vm --all-targets -- -D warnings` and `cargo fmt -p x3-vm -- --check` are clean",
  "note: measured load-bearing - restoring `journal.clear()` in `VmStorage::rollback` makes test_rollback_keeps_the_journal_of_writes_that_predate_the_window, test_nested_rollback_truncates_the_journal_to_the_inner_window and test_rollback_of_the_outer_window_abandons_a_committed_inner_window FAIL; truncating to the snapshot's journal length returns all 15 storage tests to green",
]
evidence = [
  "crates/x3-vm/src/storage.rs",
  "x3-lang/vm/src/trading.rs",
  "note: Trading Core v1 hardening item; the atomic window lifecycle (AtomicBegin/AtomicCommit/AtomicRollback + AtomicAborted) is implemented in crates/x3-vm/src/vm.rs and the rollback semantics are now proven at the storage level",
]


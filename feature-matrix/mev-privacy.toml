[[feature]]
# Re-measured 2026-09-26 (round 4, workstream C) on commit c85dba7f1 of
# feat/x3-prelaunch-economics-x3lang-cutover (not merged to master): an atomic-trade policy that
# requires private submission now lowers into the same `ModeCheck` the strategy path emits, and
# the IR verifier refuses the policy when that gate is absent or follows the trade. The
# 2026-09-22 provenance note (closed PR #135) is superseded by this block, which is TICKET-101's
# re-measurement for this row.
id = "X3-MEV-002"
name = "Private transaction submission controls"
subsystem = "mev_privacy"
source = "master"
paths = ["x3-lang/compiler", "x3-lang/vm"]
implemented = 55
tested = 40
mainnet_ready = 25
priority = "P0"
confidence = "high"
launch_scope = "guarded"
claim_risk = false
blockers = [
  "The chain-intake pipeline carries no submission policy: on-chain `.x3` goes through `crates/x3-compiler` (`compiler_bridge`) into `pallet-x3-kernel`, and `rg` over `crates/{x3-compiler,x3-vm,x3-backend,x3-common}` finds zero occurrences of `submission`/`private`/`ModeCheck`, so a program that reaches the chain cannot demand private submission at all",
  "No runtime in this repository sets `allow_private_submission = true` and no private channel is wired to the VM, so the demand is now enforced but never satisfiable on chain",
]
required_tests = [
  "a_trading_program_that_requires_private_submission_carries_the_mode_check",
  "a_required_private_submission_reaches_the_artifact_as_a_mode_check",
  "a_private_trading_policy_without_a_mode_check_is_refused",
  "a_mode_check_before_the_trade_satisfies_the_binding",
  "a_mode_check_after_the_trade_does_not_satisfy_the_binding",
  "mainnet_rejects_unattested_private_submission_policy",
  "a_compiled_trading_program_that_requires_private_submission_is_refused_without_a_channel",
  "the_same_trading_program_runs_where_the_channel_exists",
  "a_trading_program_that_does_not_demand_privacy_is_not_gated",
  "compiled_private_submission_requirement_is_enforced",
]
test_evidence = [
  "note: cargo test --manifest-path x3-lang/Cargo.toml --workspace -> exit 0, 1327 passed, 0 failed, 0 ignored across 102 test binaries (measured 2026-09-26 on c85dba7f1)",
  "note: cargo clippy --manifest-path x3-lang/Cargo.toml --workspace --all-targets -- -D warnings -> exit 0; cargo fmt --manifest-path x3-lang/Cargo.toml --all -- --check -> exit 0",
  "note: break-it-first control - with the lowering change disabled, x3-lang/examples/trading_core_v1.x3 (whose policy requires private submission) ran to Ok(()) under a VM config whose private-submission flag is false, and the three IR-verifier tests failed; restored, all pass",
]
evidence = ["x3-lang/compiler", "note: Measured 2026-09-26 (round 4) - the demand is compiled into the artifact, gated ahead of the trade and interpreted by the VM; it is still absent from the chain-intake compiler"]


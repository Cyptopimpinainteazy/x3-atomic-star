[[feature]]
# Re-measured 2026-09-26 (round 4, workstream A) on commit dd22bddfd of
# feat/x3-prelaunch-economics-x3lang-cutover: the crate is real — Ristretto Shamir
# split, Lagrange combination in the exponent, committee-ECDH + HKDF-SHA256 +
# AES-256-GCM — and a decryption share now carries the DKG ceremony it was minted
# under, refused by name when it does not match. The old "research / no evidence"
# line was stale; it was right about the missing wiring, which the blockers keep.
id = "X3-MEV-007"
name = "Encrypted mempool / threshold encryption"
subsystem = "mev_privacy"
source = "master"
paths = ["crates/private-mempool"]
implemented = 45
tested = 40
mainnet_ready = 10
priority = "P1"
confidence = "high"
launch_scope = "research"
claim_risk = false
blockers = [
  "Reachability: `cargo tree -i private-mempool --workspace` returns one consumer, `crates/confidential-gpu`, and nothing in `runtime/` or `node/` depends on confidential-gpu; `PrivateMempool` itself has no caller anywhere in the tree, and there is no ingress (no extrinsic, no node mempool, no relayer) that puts a transaction into it - the crate is measured unit by unit and drives nothing on chain",
  "No DLEQ proof accompanies a partial decryption: `compute_decryption_share` returns an empty `proof`, so a malicious validator's bogus partial is caught only by the AEAD tag after interpolation. Fail-closed, but unattributed - the combiner learns that something was wrong, not which validator lied",
  "The DKG epoch is now stated by configuration (`ConfidentialGpuConfig::dkg_epoch`) rather than driven by a ceremony or an epoch transition in this tree, so the binding is enforced while the lifecycle it binds to is never exercised end to end",
  "No live or cross-node test: every case here is unit or component level, against committees generated in-process",
]
required_tests = [
  "any_threshold_subset_reconstructs_the_same_secret",
  "below_threshold_does_not_reconstruct_the_secret",
  "t_shares_decrypt_and_one_short_never_does_over_fresh_committees",
  "combine_shares_refuses_fewer_shares_than_the_declared_threshold",
  "combine_shares_rejects_a_zero_validator_index",
  "combine_shares_rejects_duplicate_validator_indices",
  "a_share_labelled_with_an_index_outside_the_committee_fails_closed",
  "a_share_that_is_not_a_point_is_refused",
  "a_tampered_ciphertext_is_refused",
  "a_tampered_nonce_is_refused",
  "a_swapped_nonce_between_two_transactions_is_refused",
  "a_swapped_ephemeral_key_between_two_transactions_is_refused",
  "rejects_the_identity_element_as_a_committee_group_key",
  "a_share_from_a_different_dkg_epoch_is_refused_with_a_typed_error",
  "the_epoch_label_is_not_the_security_boundary",
]
test_evidence = [
  "note: cargo test -p private-mempool -> 29 passed, 0 failed, 0 ignored (19 before this lane's ten tests)",
  "note: cargo test -p confidential-gpu -> 10 passed, 0 failed; cargo clippy -p private-mempool -p confidential-gpu --all-targets -- -D warnings -> exit 0; cargo fmt --all -- --check -> exit 0",
  "note: break-it-first control - disabling the epoch check in the combiner turns a_share_from_a_different_dkg_epoch_is_refused_with_a_typed_error red, and confidential-gpu's a_share_from_another_ceremony_is_refused_by_name red; restored, both suites are green",
  "note: reachability measured 2026-09-26 - cargo tree -i private-mempool --workspace returns confidential-gpu alone, nothing in runtime/ or node/ depends on confidential-gpu, and the mempool type has no caller in the tree",
]
evidence = ["crates/private-mempool", "note: Measured 2026-09-26 (round 4, workstream A) - real Ristretto threshold crypto with adversarial coverage over a freshly generated committee per case, reached by one crate that no runtime path consumes"]

[[feature]]
id = "X3-MEV-008"
name = "Fair transaction ordering"
subsystem = "mev_privacy"
source = "master"
paths = [
  "crates/x3-order-window",
  "crates/x3-swap-router/src/mev_protection",
  "crates/x3-dex/src/batch_swap_router.rs",
]
implemented = 45
tested = 40
mainnet_ready = 10
priority = "P1"
confidence = "high"
launch_scope = "research"
claim_risk = false
blockers = [
  "No execution path consumes x3-swap-router: `cargo tree -i x3-swap-router --workspace` lists only the crate itself, so the lane orders nothing on any chain yet",
  "Beacon provenance is an off-chain assumption: a beacon is refused only while participants can still commit, so whoever installs it can grind it and bias the whole order - it needs a source the caller cannot choose (a future block hash, a VRF or a threshold signature)",
  "Sybil addresses are not prevented: the lane allows one commitment per sender address, not per entity",
  "Bond forfeiture is reported through `WindowSettlement::forfeitable_bond()` and never applied - there is no pallet integration that moves the bond",
  "The DEX batch router is a second, different ordering path and is *not* fair ordering: it now refuses a batch whose vector disagrees with its own `sequence` fields (`swaps_are_in_sequence_order`, called from both `create_batch_swap` and `execute_batch_swap`), which closes TICKET-142 — the test named `liquidation_frontrun_eliminated_by_fair_ordering` was asserting `50 > 0` on two hardcoded locals while the router read `sequence` nowhere. Enforcing the declared order is not the same as ordering fairly, and nothing in `crates/x3-dex` calls the commit-reveal lane",
]
required_tests = [
  "a_closed_window_settles_in_canonical_key_order",
  "the_sequence_does_not_depend_on_arrival_order",
  "the_sequence_is_the_key_order_and_not_the_arrival_order",
  "the_reveal_block_within_the_window_does_not_change_the_sequence",
  "reveals_landing_at_different_blocks_still_order_by_key",
  "a_reveal_without_a_commit_is_refused",
  "a_reveal_after_the_window_closes_is_refused_and_never_ordered",
  "a_reveal_before_the_window_opens_is_refused",
  "a_reveal_that_does_not_hash_to_its_commit_is_refused",
  "a_second_reveal_of_the_same_commitment_is_refused",
  "a_reveal_from_a_different_sender_is_refused",
  "an_attacker_cannot_substitute_its_payload_for_a_victims_commitment",
  "a_commitment_that_never_reveals_is_excluded_and_its_bond_reported",
  "a_commit_outside_the_window_is_refused",
  "a_bond_below_the_minimum_is_refused",
  "one_sender_may_not_commit_twice_in_a_window",
  "the_same_commit_hash_from_two_senders_is_refused",
  "an_inverted_window_is_refused",
  "a_beacon_installed_while_the_window_is_open_is_refused",
  "a_beacon_reorders_and_the_order_stays_recomputable_from_the_settlement",
  "an_oversized_reveal_is_refused",
  "a_front_runner_cannot_reorder_the_batch_by_handing_it_over_differently",
  "the_refusal_happens_before_any_output_is_accepted",
  "a_batch_in_the_order_it_declares_executes",

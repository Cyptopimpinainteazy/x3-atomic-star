[[feature]]
# Re-measured 2026-09-26 (round 5) on 703ca5d24 of feat/x3-prelaunch-economics-x3lang-cutover.
# The row's own paths (`x3-lang/compiler`, `x3-lang/vm`) are not what a chain executes; the chain
# runs X3BC through `crates/x3-vm`, and the 2026-09-22 provenance note against a closed PR is
# superseded by measurements taken on the tree itself.
id = "X3-MEV-004"
name = "Transactional host rollback"
subsystem = "mev_privacy"
source = "master"
paths = [
  "x3-lang/compiler",
  "x3-lang/vm",
  "crates/x3-vm/src/storage.rs",
  "crates/x3-vm/src/vm.rs",
]
implemented = 70
tested = 65
mainnet_ready = 40
priority = "P0"
confidence = "high"
launch_scope = "guarded"
claim_risk = false
blockers = [
  "Storage is now reachable and journaled, but the writes still do not land in chain state. `evm_sstore`/`evm_sload` (0xB4/0xB3) execute in the *std* interpreter `crates/x3-vm` as of this measurement, so a contract can carry a value between calls **off chain** - but the interpreter a block actually runs is `crates/x3-integration::mini_x3` (the node builds `sc_service::new_wasm_executor`, so the runtime's std feature is off in wasm), and it refuses both opcodes, so on chain a contract cannot carry a value between calls at all. Both halves are asserted on one artifact by `interpreter_agreement.rs::slot_storage_is_implemented_off_chain_and_refused_on_chain` (measured 2026-09-26); the std interpreter's own tests are `evm_store_and_load_round_trip_every_value_kind` and `evm_slot_keys_are_disjoint_from_global_keys`. In the std interpreter and an atomic window's rollback abandons only the window's writes - but `X3Executor::execute` (`crates/x3-integration/src/executor.rs`) returns `state_changes: vec![]` with the comment \"Hostcall state change collection deferred to runtime integration\", and `drain_storage_journal` has no caller outside `crates/x3-vm`'s own tests. A slot a program writes is therefore durable within one VM instance and invisible to everyone else (TICKET-147).",
  "The receipt's `state_changes` channel cannot carry contract storage as it stands. `pallet-x3-kernel`'s `apply_canonical_ledger_update_v2` decodes every entry as (address -> account, key -> asset id, value -> balance) and counts anything else in `DecodeFailureCount`, so routing slot writes through it would inflate a monitoring counter rather than persist a byte (TICKET-147). X3VM contract storage needs its own typed channel before it can be claimed on chain.",
  "The guarantee is proven at the VM level only. No node or validator network has executed a store, and the rollback is exercised by unit tests in `crates/x3-vm` rather than by a live chain, so this is not yet mainnet evidence.",
  "The language VM's host-transaction protocol is unexercised in production: `TradingHost::begin_transaction`/`commit_transaction`/`rollback_transaction` have no caller outside `x3-lang/vm/tests`, and the bytecode-level `ATOMIC_ROLLBACK` in `x3-lang/vm/src/executor.rs` restores VM state (registers, memory, op records, instruction count) without invoking any host hook. That is safe only if a host never applies an effect during execution - a contract that is stated in the trait's docs and enforced nowhere.",
]
required_tests = [
  "test_rollback_keeps_the_journal_of_writes_that_predate_the_window",
  "test_nested_rollback_truncates_the_journal_to_the_inner_window",
  "test_rollback_of_the_outer_window_abandons_a_committed_inner_window",
  "test_rollback_of_a_delete_restores_the_key_and_the_journal",
  "test_nested_snapshots",
  "test_snapshot_and_rollback",
  "evm_store_and_load_round_trip_every_value_kind",
  "evm_load_of_an_unwritten_slot_reads_zero",
  "evm_store_refuses_a_negative_slot",
  "evm_store_refuses_a_non_integer_slot",
  "evm_store_refuses_a_payload_that_does_not_fit_a_slot",
  "evm_store_refuses_unit",
  "evm_load_fails_closed_on_a_payload_this_isa_did_not_write",
  "evm_store_inside_a_rolled_back_window_is_abandoned",
  "evm_store_journals_the_write_for_cross_vm_sync",
  "evm_storage_is_charged_the_verifier_table_cost",
  "evm_slot_keys_are_disjoint_from_global_keys",
]
test_evidence = [
  "crates/x3-vm/src/storage.rs",
  "note: `cargo test -p x3-vm` -> 165 lib tests passed, 0 failed, 0 ignored (154 before this measurement) plus 8 in another target and one pre-existing ignored test; `cargo clippy -p x3-vm --all-targets -- -D warnings` -> exit 0; `cargo fmt -p x3-vm -- --check` -> exit 0 (measured 2026-09-26 on 703ca5d24)",
  "note: measured load-bearing (storage) - restoring `journal.clear()` in `VmStorage::rollback` makes test_rollback_keeps_the_journal_of_writes_that_predate_the_window, test_nested_rollback_truncates_the_journal_to_the_inner_window and test_rollback_of_the_outer_window_abandons_a_committed_inner_window FAIL; truncating to the snapshot's journal length returns all 15 storage tests to green",
  "note: measured load-bearing (opcodes) - guarding the two new interpreter arms off (`Opcode::EvmSload if false`, `Opcode::EvmSstore if false`, so both fall through to the `_` arm that returned `UnimplementedOpcode` before this change) reddens 10 of the 11 new tests with `UnimplementedOpcode(180)`; restored, `cargo test -p x3-vm --lib evm_` -> 15 passed, 0 failed",
  "note: fail-closed coverage - an unknown payload tag, a payload shorter than its declared kind, a negative slot and a non-integer slot each return a typed error (`CorruptStorageSlot`/`InvalidStorageSlot`) instead of a value, and a 31-byte payload is refused (`UnencodableStorageValue`) rather than truncated into a 32-byte slot",
]
evidence = [
  "crates/x3-vm/src/storage.rs",
  "crates/x3-vm/src/vm.rs",
  "x3-lang/vm/src/trading.rs",
  "note: Re-measured 2026-09-26 (round 5) - the atomic window lifecycle (AtomicBegin/AtomicCommit/AtomicRollback + AtomicAborted) is implemented in crates/x3-vm/src/vm.rs; `evm_sstore`/`evm_sload` are interpreted over a slot keyspace disjoint from the global keyspace (`evm_slot_keys_are_disjoint_from_global_keys`), priced at the verifier's own figures (200/5000), and the rollback is now proven through the opcode path and at the storage level",
]

[[feature]]
# Provenance corrected 2026-09-22: cited PR #135 was closed unmerged, so it is not a source: this row's scores were recorded against that draft. Provenance corrected against master on 2026-09-22 by reading the tree; a full re-measurement is TICKET-101; the capability is on master: x3-lang/vm/src/executor.rs (gas_limit enforcement)
id = "X3-MEV-005"
name = "Gas / economic execution limits"
subsystem = "mev_privacy"
source = "master"
paths = ["x3-lang/compiler", "x3-lang/vm"]
implemented = 75
tested = 70
mainnet_ready = 40
priority = "P0"
confidence = "high"
launch_scope = "guarded"
claim_risk = false
blockers = [
  "Re-measured 2026-09-26: the row's blocker (\"Hardening branch must enforce gas and capability versions\") is stale, and the score understated what is there. The VM charges gas per instruction from one table (`gas_cost_for_opcode` plus `gas_surcharge` for payload bytes and operands), refuses before deducting (`state.gas < cost` -> `OutOfGas`), and its costs are the same table the compiler estimates with — `the_estimate_weighs_the_instructions_with_the_table_the_vm_charges_from`. The compiled policy's gas ceiling is enforced at commit, not merely parsed: `gas_ceiling_within_policy_still_commits`, `gas_ceiling_exceeded_rejects_even_though_profit_and_debts_are_fine`, `gas_ceiling_is_enforced_at_commit_even_with_no_other_guard_operations`. The compiled policy *version* is checked against the host's before any host call begins: `compiled_policy_version_mismatch_is_rejected_before_host_transaction`. Property coverage exists: `prop_gas_never_exceeds_initial`, `prop_out_of_gas_deterministic`, plus `pow_gas_is_consumed` and `pow_gas_scales_with_exponent`.",
  "What that does not establish, and why mainnet readiness stays at 40. The ceiling is a *policy refusal*, not a bound on work: a program over its cap still executes to the commit point and is then rejected, so the work is bounded by the gas budget the host hands the VM, not by the program's declared ceiling (`VM::new(bytecode, config, gas)` — the budget is a constructor argument). Nothing in the tree measures the gas table against a real venue workload, so 'the estimate' and 'the charge' agree with each other, not with the cost of anything in production.",
  "No live-network run: the ceilings and the version gate have never been exercised by a program submitted to a running validator set, and the `x3c` CLI's `receipt execute` derives its capability manifest from the same policy it is meant to check, so that fixture path cannot fail its own check (recorded on X3-MEV-002).",
]
required_tests = [
  "gas_ceiling_within_policy_still_commits",
  "gas_ceiling_exceeded_rejects_even_though_profit_and_debts_are_fine",
  "gas_ceiling_is_enforced_at_commit_even_with_no_other_guard_operations",
  "compiled_policy_version_mismatch_is_rejected_before_host_transaction",
  "prop_gas_never_exceeds_initial",
  "prop_out_of_gas_deterministic",
  "pow_gas_is_consumed",
  "the_estimate_weighs_the_instructions_with_the_table_the_vm_charges_from",
]
test_evidence = [
  "x3-lang/vm/tests/trading_execution.rs",
  "x3-lang/vm/tests/property_tests.rs",
  "x3-lang/compiler/tests/test_cost.rs",
  "note: `cargo test --manifest-path x3-lang/Cargo.toml -p x3-lang-vm --test trading_execution` -> 68 passed, 0 failed, including the three gas-ceiling cases and the policy-version case; `-p x3-lang-vm --test property_tests` -> 9 passed; `-p x3-lang-compiler --test test_cost` -> 3 passed",
  "note: x3-lang/vm/src/executor.rs charges per instruction before executing it (`if vm.state.gas < cost { return Err(ExecError::OutOfGas) }` then `vm.state.gas -= cost`), so an over-budget program stops rather than overrunning",
]
evidence = ["x3-lang/compiler", "x3-lang/vm/src/executor.rs", "note: Trading Core v1 gap list; re-measured 2026-09-26 because the recorded blocker no longer described the tree"]


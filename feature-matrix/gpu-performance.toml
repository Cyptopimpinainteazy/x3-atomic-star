[[feature]]
id = "X3-GPU-013"
name = "GPU divergence quarantine / fallback"
subsystem = "gpu_performance"
source = "master"
paths = ["crates/x3-gpu-validator-swarm"]
implemented = 75
tested = 65
mainnet_ready = 50
priority = "P1"
confidence = "high"
launch_scope = "guarded"
claim_risk = false
blockers = [
  "**CLOSED 2026-09-25 — `UnifiedProof::validate()` called any non-empty bytes an attestation.** `proof_integration.rs` asserted `is_valid` for proofs whose attestation signature was `vec![1, 2, 3, 4]` and `vec![9, 9, 9]`, while the crate's own verifier — `ProofAggregator::signature_from_bytes`, then `verify_attestations` against a registered public key — refuses anything that is not 65 bytes (`r || s || recovery`). A caller who only saw `ProofValidationResult::is_valid` was told a placeholder was evidence. The check now requires `crypto::SIGNATURE_LENGTH`, one named constant shared with the verifier so the two cannot drift, and it is measured load-bearing: reverting it to `is_empty()` turns exactly `validate_refuses_a_signature_that_is_not_the_shape_the_verifier_reads` red (110 passed, 1 failed, file restored).",
  "An empty attestation set stays a *warning*, on purpose, because the aggregator's flow is submit-first: `test_submit_proof` submits an unattested proof and expects it collected, and only `add_attestation` past `finality_threshold` moves the entry. `an_unattested_proof_is_collected_but_never_finalized` pins the other half — silence never becomes finality.",
  "**CLOSED 2026-09-26 — the second receipt convention is gone and the surviving one is wired.** `GpuReceiptValidator::verify_signature` accepted a 96-byte `pubkey || signature` blob and verified it over `kernel_hash` alone: the signature carried its own public key, so any caller could mint a passing one, and `output_commitment` — the field a validator is being asked to be honest about — could be rewritten under a valid signature. Nothing called it. `GpuReceiptValidator` now owns the one convention this crate uses (`attestation_message`: a domain tag over every receipt field plus bundle id, finalized block and legs hash; `parse_signature`: exactly 65 bytes, `r || s || recovery`; `verify_attestation_signature`: verified against the key the caller resolved from its own registry). `ProofAggregator::verify_attestations` and `Validator::signing_message` both call it instead of carrying byte-identical copies of the hash, so the signing and verifying sides cannot drift. Regression tests in `gpu_receipt.rs` pin the attack that the retired check allowed (`rewriting_the_output_commitment_breaks_the_signature` — measured load-bearing: unbinding `output_commitment` from the message turns exactly that test red) plus replay across block/bundle, a foreign key, and the retired 96-byte blob.",
  "Needs real GPU failure injection",
]
test_evidence = [
  "note: the two regression tests are crates/x3-gpu-validator-swarm/src/unified_proof.rs (validate refuses a 4-byte signature, naming both lengths) and src/proof_aggregator.rs (an unattested proof is collected, never finalized), on 2026-09-25",
  "note: the crate is gated by `test x3-gpu-validator-swarm` (added 2026-09-25 — it had no gate): 111 lib tests plus its integration suites, all green",
]
evidence = ["crates/x3-gpu-validator-swarm", "note: Honest audit describes divergence detection, replay, quarantine, CPU fallback", "note: 2026-09-25 - the structural validator accepted placeholder signatures as attestations and the crate's tests ran nowhere"]


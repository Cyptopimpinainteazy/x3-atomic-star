  "The log-level finding is part of the fix, not a footnote: a node started without a filter emits warnings only — 13 lines of banner per validator, no chain identity, no imports, no finality — so the collection contract includes the level.",
  "**CLOSED 2026-09-26 at testnet scale — seven validators, not three.** `scripts/monitoring/testnet7-observability-check.sh` (gate: `observability across seven validators`, ~45s, serial) builds a generated seven-authority spec, boots it with the launcher, and requires per validator: its own exporter answering 200, the node's `substrate_build_info{name=...}` label matching the validator it was scraped from, the chain label, a finalized height past genesis, the mesh peer floor, and a non-full-node role; then that all seven agree on the canonical hash at a common finalized height, that each of the seven collected log streams carries identity/imports/finality, and that one aggregate query over the sink reaches all seven sources. Measured: seven nodes named x3-testnet-node-01..07 on chain x3_chain_testnet, finalized 75..95, peers 6, role 4, logs at last imported #104 and finalized #99..#101. `--self-test` holds one validator out of both collections and requires both checks to fail (`only 6 of 7 observed`, `the aggregate query reaches 6 of 7 streams`). Four findings that only appear at this size: the spec's bootNodes are built from `P2P_BASE` (build the spec for the base you launch on, or the mesh collapses to one hub and six validators report exactly 1 peer); 'a finalized head exists' is not finality (a fresh node answers with the genesis hash at height 0, so the weak check passes at `best=1, finalized=0`); the exported finalized gauge lags its own node (measured: RPC past height 6 while the metric read 0); and demanding `COUNT-1` peers from every node fails a healthy network (the two-hour soak measured a minimum of 5).",

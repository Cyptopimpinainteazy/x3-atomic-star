# Operations / User Tools feature matrix fragment.

[[feature]]
id = "X3-OPS-001"
name = "Genesis ceremony tooling"
subsystem = "operations_user_tools"
source = "master"
paths = ["scripts/mainnet/genesis_ceremony.sh", "scripts/testnet/testnet-ceremony.py", "scripts/testnet/testnet-ceremony-drill.sh", "tests/test_ceremony_attestations.py"]
implemented = 92
tested = 85
mainnet_ready = 58
priority = "P0"
confidence = "high"
launch_scope = "guarded"
claim_risk = false
blockers = [
  "The mainnet ceremony itself has not been run: `genesis_ceremony.sh` requires a tagged release commit and srtool, and no tag exists",
  "**CLOSED 2026-09-27 — the record is signed, and the signature is one the chain would recognise.** The claim above (\u201cnothing publishes a signed manifest\u201d) was true: `record` produced a file and `verify` checked it, and nothing said *who* agreed to the artifacts. The manifest now carries an `attestations` block \u2014 each authority signs the manifest's canonical bytes (JSON, sorted keys, `attestations` removed) with the ed25519 key its GRANDPA authority **is**, generated through OpenSSL from the seed the spec's authority was derived from. The tool refuses a key that is not in the authority set, an authority that signs twice, and appending to a manifest that has been edited since it was signed (stale signatures); `verify` requires a supermajority of *distinct* authority signatures and recomputes the threshold `floor(2n/3)+1` from the authority set rather than believing the manifest's own copy of it. The authority set is decoded twice \u2014 SS58 addresses from the spec, with the checksum verified, and the SCALE `Vec<(AuthorityId, u64)>` the chain reports \u2014 and a manifest whose two accounts disagree is refused. `sign` is the rehearsal form (one machine holds every key); `attest --key <seed>` adds one operator's signature, which is the shape a real ceremony has. Measured on a four-validator network: 4/4 signed, threshold 3, `verify` PASS, and eight refusals (see `test_evidence`). The recorded binary is the `target/release` build (the drill's discovery already prefers it), so the old \u201crecorded node binary is a debug build\u201d half is no longer the state \u2014 but it is still *this box's* release build rather than a tagged srtool artifact, which is the first blocker, not this one.",
  "The recorded launch is loopback (four validators on one host) and its bootnodes are /ip4/127.0.0.1/... entries",
  "Still open, and why this is not mainnet-ready: the ceremony has never been run against a tagged release with operators on separate machines. `attest` makes that shape possible but no operator has used it, so the multi-party path is proven against keys on one host, not against four people in four places. `genesis_ceremony.sh` still requires a tag that does not exist, the launch is loopback, and nothing publishes the signed manifest anywhere a stranger could fetch it \u2014 the signature is checkable, but there is no distribution step.",
]
# The rehearsal of the whole ceremony now runs, and it produces the artifact a launch
# can be verified against: `testnet-ceremony.py record` writes the spec sha256 (and
# size), the node binary sha256, the chain name/id/type, the genesis hash the network
# reports, the runtime version, the authority sets from the spec, and every validator's
# peer id and finalized height; `verify` re-checks all of it against a running network,
# one line per check. `--testnet` runs the drill: build spec → boot four validators →
# record → verify → tamper with a copy → require the verifier to reject it.
evidence = ["scripts/mainnet/genesis_ceremony.sh", "scripts/testnet/testnet-ceremony.py", "scripts/testnet/testnet-ceremony-drill.sh", "scripts/testnet/build-x3-testnet-spec.py", "note: 2026-09-22 first-hand — the drill records `X3 Chain Testnet` (Live, id x3_chain_testnet) with genesis 0xa1005528d8d6ec35693e37f8d72a85408067aabeca8fa7f8a6379184628000ad, spec sha256 a3cc9e39719fe017…, 4 aura / 4 grandpa authorities and every validator's peer id + finalized height (273 at record time, 3 peers each); `verify` passes every check against the live network and fails a manifest whose genesis hash was tampered with. `genesis_ceremony.sh` (15.6 kB) remains the mainnet, tagged-commit half"]
test_evidence = [
  "note: 2026-09-27 - `bash scripts/local-ci.sh --testnet --only testnet-ceremony-drill` records a four-validator launch, signs it with all four GRANDPA keys, verifies it against the running network, and then proves eight refusals: a tampered genesis hash (which now fails the hash check *and* the signature), an unsigned manifest, a manifest below its own threshold, a valid signature from a key outside the authority set, a flipped signature byte, a manifest that lowers its own threshold, the same authority signing twice, and `attest` adding to a manifest edited since it was signed",
  "note: 2026-09-27 - `python3 tests/test_ceremony_attestations.py` (20 tests) is the fast half: base58 with leading zeroes and a rejected alphabet character, an SS58 checksum refusal, SCALE authority-set decoding including a truncated input, the threshold rule for n=1..7 (4 -> 3, 7 -> 5), the ed25519 derivation pinned against `x3-chain-node keys generate --key-type grandpa --seed 0x000102…1f --output hex`, a signature that verifies and four that must not, and the canonical-bytes rule (the `attestations` member is not covered, key order is irrelevant, a signed field is)",
]

[[feature]]
id = "X3-OPS-002"
name = "Snapshot / restore tooling"
subsystem = "operations_user_tools"
source = "master"
paths = ["scripts/snapshot-restore.sh", "scripts/snapshot-live-restore-proof.sh", "scripts/snapshot-zero-downtime-proof.sh", "crates/x3-state-snapshot/src/lib.rs", "crates/x3-state-snapshot/src/tests.rs"]
implemented = 85
tested = 80
mainnet_ready = 58
priority = "P0"
confidence = "high"
launch_scope = "guarded"
claim_risk = false
blockers = [
  "**CLOSED 2026-09-26 — there is a live restore proof, and it is load-bearing.** This row asked for \"live restore drills and integrity verification\"; the only restore test round-tripped a text file through a tarball, which passes just as well for an empty database. `scripts/snapshot-live-restore-proof.sh` (gate: `snapshot restore across a live chain`, serial, ~25s) boots a real chain, reads the anchor *from the running node* — finalized height, canonical hash at that height, state root, and every storage entry at that height over RPC — stops it, snapshots with `snapshot-restore.sh backup`, restores into a fresh base path, boots a node on the restored database and requires height, hash, state root and the whole state map to come back identical (169 keys). It then boots a **control** node on an empty base path, lets it reach the same height, and requires its hash to differ, so the same check cannot pass for an empty chain. Measured: height 9, hash 0x0193e88c…, control 0x5f51ff2c… Also green: launch-gates/snapshot-murder-test.sh (20 passed) and `cargo test -p x3-state-snapshot` (48 passed).",
  "**CLOSED 2026-09-27 — the snapshot is taken with the node still running, and the drift it found is fixed.** The open item above named two acceptable designs; this is the RPC one. `scripts/snapshot-rpc-export.py` pins one finalized, GRANDPA-justified block, pages every key at that block hash and reads every value at the same hash, and `scripts/snapshot-zero-downtime-proof.sh` (gate: `snapshot zero downtime export`, serial, ~4 min) composes it with the existing builder. The measured run: an archive node at finalized height 523 while the export read the chain and kept finalizing (523 -> 572 -> 587 during and after), 1881 keys exported at height 513, and the trie root recomputed *from those entries* by `x3-state-snapshot root --from-raw-spec` came out exactly the `stateRoot` the chain published in that block's header (0x4de17ec4…). That is the export being measured against the chain rather than against itself: one missing key, one value read at the wrong block, or one invented key all move that root. The snapshot's `finality_proof` is the chain's own GRANDPA justification read back from `chain_getBlock` — not a placeholder — and the gate refuses an anchor that has none (`justification_generation_period` is 512 on this node, so the walk-back to the newest justified block is the normal path, not an exception).",
  "**The first boot of a restored spec found a real defect, and it is fixed.** `x3-state-snapshot restore` wrote the state verbatim into `genesis.raw.top`, including `frame_system`'s per-block bookkeeping — so `System::Number` was the *producing* chain's height, and `frame_system::initialize` asserts `number == Self::block_number() + 1`. The restored chain panicked on its first block (`Block number must be strictly increasing. left: 513 right: 1`) and finalized nothing; the drill's red run is saved under `.ai/runlogs/`. `restore --regenesis` now drops the six named `frame_system` entries (`CHAIN_BOOKKEEPING_ENTRIES`, keys derived with `sp_core::twox_128`, not pasted hex), reports both roots instead of presenting one as the other, and records the drop in the spec's `properties`. With it, the restored chain boots as an authority and finalizes (measured: finalized height 7), its genesis state root equals the reported regenerated root, and all 1877 non-bookkeeping entries are byte-identical to the exported state.",
  "Still open, and why this is not mainnet-ready: the export reads values **one RPC call per key** (1881 keys in ~2.4 s on loopback; a real chain has orders of magnitude more, and no batching — `state_getReadProof`-style range reads — has been written), so the multi-GB size class and the *time* a real validator would spend exporting are both unexercised. The export needs a node whose pruning window still covers the anchor: the gate demonstrates that a bounded node **refuses** an anchor it has pruned (naming pruning, writing no spec) rather than exporting a partial state, but the operator story that follows from it — run a dedicated archive node, or export inside the window — is documented guidance, not an automated provisioning step. `--regenesis` drops a fixed list of six `frame_system` entries; nothing enumerates *every* chain-local key a runtime might keep (a third-party pallet's 'current block' would still leak into the restored genesis). And a restore still produces a *new* chain, not a continuation of the same one: state-sync for an existing chain continues to need the base-path path or warp sync.",
]
evidence = ["scripts/snapshot-restore.sh", "note: Independent audit previously scored snapshot/restore partial", "note: 2026-09-27 - `snapshot-restore.sh export-rpc` is the operator entry point for the zero-downtime path, and `zero-downtime-proof` runs the gate"]
test_evidence = [
  "note: 2026-09-27 (primary agent, re-run) — the end-to-end proof passes: `bash scripts/snapshot-zero-downtime-proof.sh` exit 0, 1881 state entries exported from a **running** node (head 522 -> 552 -> 559 across the export), the recomputed trie root equal to the `stateRoot` the chain published in that block, the chain's own GRANDPA justification carried into the manifest, and the restored chain then *authoring* blocks (finalizing at height 8) with all 1877 non-bookkeeping entries recovered byte-identically. It also found a defect in the gate itself: the restore call was missing `--regenesis`, so the restored spec carried the producing chain's `frame_system` bookkeeping and the proof died reading `properties.x3SnapshotBookkeepingRemoved` — the flag is now passed, and the three negative controls still refuse (one-key-short export, genesis-only spec, pruned anchor)",
  "note: 2026-09-27 - `bash scripts/local-ci.sh --only snapshot-zero-downtime-export` is the end-to-end proof (running chain -> RPC export -> chain's own state root -> chain's own GRANDPA justification -> build -> verify -> restore -> a booted authority that finalizes); the raw output of the red run and the green run is under `.ai/runlogs/`",
  "note: 2026-09-27 - the exporter's refusals are unit-tested in `tests/test_snapshot_rpc_export.py` against a real loopback JSON-RPC server, one case per refusal: a key the enumeration returned whose value read is null, a page walk that never advances, an anchor that is not the canonical block at its height, an anchor with no justification, an anchor whose state the node has pruned, a child-trie template, an existing output, and a missing RPC method",
  "note: 2026-09-27 - `cargo test -p x3-state-snapshot` (53 passed) owns the re-genesis semantics: the well-known `System::Number` key is pinned against the constant every client uses, the reset drops only the entries the state actually carried, a state with no `frame_system` bookkeeping at all is refused, and a regenerated spec reports a genesis root that is deliberately *not* the snapshot root",
  "note: 2026-09-27 - the four controls the gate requires to fail: a one-key-short export changes the recomputed root and `build` refuses it against the declared root; `verify` refuses the good snapshot against a different anchor; an unaltered genesis spec does not reproduce the anchor's root (130 keys, different root); and a bounded node refuses a pruned anchor without writing a spec",
]
required_tests = [
  "a_restored_spec_reproduces_exactly_the_state_that_was_verified",
  "a_regenerated_spec_is_a_new_chain_and_reports_both_roots",
  "regenesis_drops_the_producing_chains_bookkeeping_and_nothing_else",
  "the_bookkeeping_keys_are_the_ones_the_runtime_actually_uses",
  "a_state_with_no_bookkeeping_at_all_is_refused_by_the_reset",
  "a_restore_that_is_not_asked_to_regenerate_keeps_the_chain_bookkeeping",
]

[[feature]]
id = "X3-OPS-003"
name = "Public testnet gate"
subsystem = "operations_user_tools"
source = "master"
paths = ["scripts/mainnet/public_testnet_gate.sh", "scripts/testnet/testnet-ceremony.py", "scripts/testnet/testnet-ceremony-drill.sh", "docs/reports/PUBLIC_TESTNET_LAUNCH.md"]
implemented = 85
tested = 85
mainnet_ready = 52
priority = "P0"
confidence = "high"
launch_scope = "guarded"
claim_risk = false
blockers = [
  "There is no public testnet to gate: measured 2026-09-22 — `rpc.testnet.x3-chain.io`, `faucet.testnet.x3-chain.io` and `bootnode.testnet.x3-chain.io` do not resolve (from a host whose DNS reaches github.com), `gh run list --workflow testnet-deploy.yml` is empty, and every step of docs/reports/TESTNET_DEPLOYMENT_CHECKLIST.md is unchecked",
  "No hosting, DNS, TLS or monitoring is provisioned, so the gate has nothing to point at; its default is `http://localhost:9933`",
  "The gate is RPC-only: it cannot see whether the network is *independently* operated, which is the property a public testnet exists to demonstrate",
  "**2026-09-26 — the gate runs, and it reads the chain's own numbers.** It was run against a real seven-validator testnet network (on this one host): 14 of 15 criteria PASS and the 15th is a SKIP. Reaching that took three real defects out of the way, each measured: gate 1 counted `peers + 1` and called it a validator count (`GrandpaApi_grandpa_authorities` is a hex SCALE blob and `jq length` on it is a parse error, so the code fell through to the fallback — it reported `found 6, need 7` on a seven-authority chain with one validator stopped), gates 10 and 11 issued `cargo test -p X name1 name2`, which is `error: unexpected argument` (one positional filter only — both criteria could never pass, whatever the tests did), and gate 5 looked for treasury/faucet fields no real spec has. Gate 6 (72-hour stability) is the SKIP: `X3_TESTNET_HOURS=0` is the CI form and the timer cannot be answered on this box. The verdict now says `PASS with skipped criteria` and names it, where it used to claim all criteria were met.",
  "**2026-09-26 — criterion 14 now pins, names and proves itself, and the drill for it found a live hole.** `X3_EXPLORER_URL` is a *pin*, not a first-try hint: with the URL only prepended to the default list, `scripts/testnet/explorer-gate-drill.sh`'s decoy phase (a plain `python3 -m http.server` on its own pinned port) failed — because a leftover `next start -p 3010` from an earlier manual run satisfied the criterion on a different port. With the pin honoured, the drill proves both directions on this tree: decoy -> `| 14 | Explorer/dashboard | FAIL |` plus `answered but does not identify itself as the X3 explorer`; `apps/explorer` -> `| 14 | Explorer/dashboard | PASS (reached http://127.0.0.1:3410, body identifies as the X3 Chain Explorer) |`. The report names the explorer, and the drill leaves both reports under `.ai/runlogs/explorer-gate-drill-*`. What is still weak, measured in the same pass: the body that satisfies the identity check is an eight-line stub page (see X3-OPS-009), so this criterion now says *an explorer is serving*, not *an explorer is showing chain data*.",
  "The gate is still RPC-only: it cannot see whether the network is *independently* operated, and it has only ever run against loopback networks on one host. Hosting, DNS, TLS and monitoring remain unprovisioned.",
]
evidence = ["scripts/mainnet/public_testnet_gate.sh", "scripts/testnet/testnet-ceremony.py", "scripts/local-ci.sh", "docs/reports/PUBLIC_TESTNET_LAUNCH.md", "note: two runnable gates — the 25.6 kB RPC gate (system_health, GRANDPA authorities, bridge storage, block height over `--rpc-base-url`) and the ceremony verifier (genesis hash, spec sha256, runtime version, authority set, peer ids, finality; seen to reject a tampered manifest) — plus a spec builder that takes published `PUBLIC_BOOTNODES` and a bootnode identity tool, so the operator path up to 'point the gate at a hosted endpoint' is written down and exercised; `bash scripts/local-ci.sh --testnet --only testnet-ceremony-drill` PASS 290s"]
# The gate's own numbers, re-run rather than remembered. The drill boots a generated
# seven-authority network, points the gate at it, and requires criterion 1 to report the
# authority set *and* the reachable count from the chain — then stops one validator and
# requires the same criterion to fail, so it cannot pass on a constant.
test_evidence = [
  "scripts/testnet/public-testnet-gate-drill.sh",
  "scripts/mainnet/public_testnet_gate.sh",
  "scripts/testnet/x3_testnet_up.sh",
  "note: `bash scripts/testnet/public-testnet-gate-drill.sh --self-test` PASS on 2026-09-26 against a generated seven-authority network (validators on rpc 19820-19826). Criterion 1 reported `authority set: 7, reachable now: 7 (peers: 6)` — the authority set read from `GrandpaApi_grandpa_authorities`, the reachable count from `system_health`; criterion 12 (live RPC smoke) PASS; then the self-test stopped node 7 and required the same criterion to fail, and it did: `7 authorities configured but only 6 reachable (peers: 5)`. Across all fifteen criteria on that healthy network: 13 PASS, 1 SKIP (6, the 72-hour timer, `X3_TESTNET_HOURS=0`) and 1 FAIL (14, explorer/dashboard — see the blocker above), so the gate's overall verdict is FAIL and the drill says which criteria it owns rather than hiding the rest. Three of the passes are not chain properties: 7, 8 and 9 read drill reports on this box, and 13 runs the wallet app's own jest suite.",
]

[[feature]]
id = "X3-OPS-004"
name = "Telemetry integration"
subsystem = "operations_user_tools"
source = "master"

  "**CLOSED 2026-09-26 — a real collector ingests all seven streams.** The previous note was that the log half was a directory of files rather than a collector. Fluent Bit is installed and the check now runs one: a tail input per validator with its own tag, one file output as the sink, and the collector metrics required to show records ingested for every validator (`fluentbit_input_records_total{name=\"tail.N\"} > 0`). Measured: `Fluent Bit ingests 7 of 7 validator streams into 7 attributable sink file(s)` — one sink file per tag, each holding that validator finalized-block lines, so the collected stream is attributable per validator rather than one merged blob. Under `--self-test` the held-out validator is left out of the target list, the scrape, the log collection and the collector, and all four checks drop to six. The gate sets `X3_OBSERVABILITY_REQUIRE_REAL=1`, so a missing Prometheus, Grafana or Fluent Bit is a failure naming the install rather than an `info` line that reads like a pass.",

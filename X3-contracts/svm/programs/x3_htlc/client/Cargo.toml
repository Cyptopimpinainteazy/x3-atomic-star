[package]
name = "x3-htlc-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Live X3 HTLC broadcaster for the SVM/Solana `x3_htlc` program (real signing + RPC submit)"
publish = false

[dependencies]
solana-sdk = "=3.0.0"
solana-rpc-client = "=3.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

[lib]
name = "x3_htlc_client"
crate-type = ["lib"]

# Standalone root: like `programs/svm/x3_atomic_swap/client`, this live client is
# intentionally kept OUT of the `X3-contracts/svm` and root X3 workspaces so a
# real devnet broadcaster can never pollute the no_std member/dependency graph.
[workspace]
